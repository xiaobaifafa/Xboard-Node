name: Xray Feature Branch Tests

on:
  push:
    branches:
      - fix/close-user-connections-on-quota

concurrency:
  group: xray-feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Run tests
        run: make test

      - name: Build Linux amd64
        run: make build-linux
