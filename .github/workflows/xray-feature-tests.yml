name: Xray Feature Branch Tests

on:
  push:
    branches:
      - fix/close-user-connections-on-quota

concurrency:
  group: xray-feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Download pinned Xray core fork
        run: |
          go mod download github.com/xtls/xray-core
          grep -i 'xray-core' go.sum

      - name: Test Xray raw splice implementation
        run: go test -race github.com/xtls/xray-core/proxy -run 'TestCopyRawConnWithSplice' -count=1 -v

      - name: Run tests
        run: make test

      - name: Build Linux amd64
        run: make build-linux
